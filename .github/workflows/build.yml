name: Apoya Basan Client build
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mine

      - uses: actions/checkout@v4
        with:
          repository: Wurst-Imperium/Wurst7
          ref: v7.56.1-MC1.21.11
          path: wurst

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25


      - uses: actions/upload-artifact@v4
        with:
          name: apoya-basan-client
          path: wurst/build/libs/*.jar
