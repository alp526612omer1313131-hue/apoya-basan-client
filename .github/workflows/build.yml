name: Apoya Basan Client build
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mine

      - uses: actions/checkout@v4
        with:
          repository: Wurst-Imperium/Wurst7
          ref: v7.56.1-MC1.21.11
          path: wurst

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Repodaki java dosyalarini listele
        run: find mine -name "*.java"

      - name: Kendi dosyami Wurst'a kopyala
        run: |
          mkdir -p wurst/src/main/java/net/wurstclient/clickgui/screens
          find mine -iname "Apoyaclickguiscreen.java" -exec cp {} wurst/src/main/java/net/wurstclient/clickgui/screens/ \;

      - name: Derle
        working-directory: wurst
        run: |
          chmod +x gradlew
          ./gradlew spotlessApply --no-daemon
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: apoya-basan-client
          path: wurst/build/libs/*.jar
          if-no-files-found: error
